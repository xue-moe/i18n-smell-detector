name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm test
      - run: node bin/i18n-smell-detector.js --help
      - run: npx i18n-smell-detector check-identical --config examples/vue-vite/i18n-smell.config.mjs --fail-on none
